services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD}@postgres:5432/rag
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: all-minilm
      DOCUMENTS_DIR: /documents
    volumes:
      - ${DOCUMENTS_PATH:-./examples/documents}:/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=5).close()"]
      interval: 15s
      timeout: 6s
      retries: 3
    mem_limit: 512m
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: all-minilm
      TEST_DATABASE_URL: postgresql://rag:test-only@postgres-test:5432/rag_test
    volumes:
      - ./examples/documents:/fixtures:ro
    depends_on:
      ollama:
        condition: service_started
    mem_limit: 512m
  postgres-test:
    profiles: [test]
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: rag_test
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    mem_limit: 512m
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m
  ollama:
    image: ollama/ollama:latest@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    environment:
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ./data/ollama:/root/.ollama
    mem_limit: 2g
